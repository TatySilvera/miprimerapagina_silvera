<style>
    /* tipografía */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300&display=swap');

    body { 
        background-color: #FFF0F5; 
        font-family: 'Poppins', sans-serif; 
        color: #5D5D5D; 
        margin: 0;
    }

    /*título principal */
    .header-title {
        font-family: 'Playfair Display', serif;
        font-size: 3.5rem; /* Tamaño grande */
        text-align: center; /* Centrado */
        color: #f368d9; /* Un rosa más fuerte para resaltar */
        margin-top: 30px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    nav { 
        background-color: #E0F2F1; 
        padding: 1.5rem; 
        text-align: center; /* Centra el menú */
        border-bottom: 3px solid #B2DFDB; 
    }
</style>

<h1 class="header-title">Chiquerrimo Accesorios</h1>
<main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
